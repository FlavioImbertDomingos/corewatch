name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          sudo apt-get update && sudo apt-get install -y ksh shellcheck
          pip install -e ".[dev]"
      - name: Unit tests (Python, job wrapper, AIX collector against recorded output)
        run: pytest -q
      - name: Shell checks
        run: |
          shellcheck -S warning collectors/linux/corewatch_linux.sh collectors/common/corewatch_job.sh
          ksh -n collectors/aix/corewatch_aix.sh
      - name: Alert rules
        run: |
          docker run --rm -v "$PWD:/w" -w /w --entrypoint promtool quay.io/prometheus/prometheus:v2.54.1 \
            check rules prometheus/rules/db2.yml prometheus/rules/hosts.yml prometheus/rules/jobs.yml
          docker run --rm -v "$PWD:/w" -w /w/tests --entrypoint promtool quay.io/prometheus/prometheus:v2.54.1 \
            test rules rules_test.yml
          docker run --rm -v "$PWD:/w" -w /w --entrypoint amtool quay.io/prometheus/alertmanager:v0.27.0 \
            check-config alertmanager/alertmanager.yml
