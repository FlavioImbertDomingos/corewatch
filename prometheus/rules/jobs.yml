groups:
  - name: jobs
    rules:
      - alert: JobFailed
        expr: corewatch_job_last_exit_code != 0 and corewatch_job_running == 0
        labels: { severity: page, layer: jobs }
        annotations:
          summary: "Job {{ $labels.job_name }} on {{ $labels.instance }} ended with exit code {{ $value }}"
          runbook_url: "https://github.com/FlavioImbertDomingos/corewatch/blob/main/docs/runbooks.md#jobfailed"

      # The alert people forget: the job that never started.
      - alert: JobOverdue
        expr: |
          corewatch_job_max_age_seconds > 0
            and time() - corewatch_job_last_success_seconds > corewatch_job_max_age_seconds
        labels: { severity: page, layer: jobs }
        annotations:
          summary: "Job {{ $labels.job_name }} on {{ $labels.instance }} has not succeeded within its allowed window"
          runbook_url: "https://github.com/FlavioImbertDomingos/corewatch/blob/main/docs/runbooks.md#joboverdue"

      - alert: JobRunningLong
        expr: |
          corewatch_job_running == 1
            and avg_over_time(corewatch_job_last_duration_seconds[7d]) > 60
            and time() - corewatch_job_last_start_seconds
              > 2 * avg_over_time(corewatch_job_last_duration_seconds[7d])
        labels: { severity: ticket, layer: jobs }
        annotations:
          summary: "Job {{ $labels.job_name }} on {{ $labels.instance }} has run more than twice its usual time"
          runbook_url: "https://github.com/FlavioImbertDomingos/corewatch/blob/main/docs/runbooks.md#jobrunninglong"

      - alert: TextfileStale
        expr: corewatch_textfile_age_seconds > 900
        labels: { severity: ticket, layer: monitoring }
        annotations:
          summary: "{{ $labels.file }} on {{ $labels.instance }} has not been rewritten for {{ $value | humanizeDuration }}"
          runbook_url: "https://github.com/FlavioImbertDomingos/corewatch/blob/main/docs/runbooks.md#collectorstale"
