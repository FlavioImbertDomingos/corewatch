groups:
  - name: hosts
    rules:
      - alert: HostDown
        expr: up{job=~"aix|linux"} == 0
        for: 2m
        labels: { severity: page, layer: host }
        annotations:
          summary: "{{ $labels.instance }} is not answering scrapes"
          runbook_url: "https://github.com/FlavioImbertDomingos/corewatch/blob/main/docs/runbooks.md#hostdown"

  - name: aix
    rules:
      - alert: AixHardwareError
        expr: aix_errpt_entries{type="P", class="H"} > 0
        labels: { severity: page, layer: aix }
        annotations:
          summary: "{{ $value }} permanent hardware errors in errpt on {{ $labels.instance }}"
          runbook_url: "https://github.com/FlavioImbertDomingos/corewatch/blob/main/docs/runbooks.md#aixerrpt"

      - alert: AixSoftwareError
        expr: aix_errpt_entries{type="P", class="S"} > 0
        labels: { severity: ticket, layer: aix }
        annotations:
          summary: "{{ $value }} permanent software errors in errpt on {{ $labels.instance }}"
          runbook_url: "https://github.com/FlavioImbertDomingos/corewatch/blob/main/docs/runbooks.md#aixerrpt"

      - alert: AixStalePartitions
        expr: aix_vg_stale_pps > 0
        for: 15m
        labels: { severity: ticket, layer: aix }
        annotations:
          summary: "Volume group {{ $labels.vg }} on {{ $labels.instance }} has {{ $value }} stale partitions; the mirror is out of sync"
          runbook_url: "https://github.com/FlavioImbertDomingos/corewatch/blob/main/docs/runbooks.md#aixstale"

      - alert: AixDiskPathNotEnabled
        expr: aix_mpio_paths{status!="Enabled"} > 0
        for: 5m
        labels: { severity: page, layer: aix }
        annotations:
          summary: "{{ $value }} disk paths are {{ $labels.status }} on {{ $labels.instance }}"
          runbook_url: "https://github.com/FlavioImbertDomingos/corewatch/blob/main/docs/runbooks.md#aixpaths"

      - alert: AixPagingSpaceHigh
        expr: aix_paging_space_used_ratio > 0.70
        for: 10m
        labels: { severity: ticket, layer: aix }
        annotations:
          summary: "Paging space is {{ $value | humanizePercentage }} used on {{ $labels.instance }}"
          runbook_url: "https://github.com/FlavioImbertDomingos/corewatch/blob/main/docs/runbooks.md#aixpaging"

      - alert: AixFilesystemNearlyFull
        expr: aix_filesystem_used_ratio > 0.90
        for: 10m
        labels: { severity: ticket, layer: aix }
        annotations:
          summary: "{{ $labels.mountpoint }} is {{ $value | humanizePercentage }} full on {{ $labels.instance }}"
          runbook_url: "https://github.com/FlavioImbertDomingos/corewatch/blob/main/docs/runbooks.md#filesystem"

      - alert: AixFilesystemFull
        expr: aix_filesystem_used_ratio > 0.97
        for: 2m
        labels: { severity: page, layer: aix }
        annotations:
          summary: "{{ $labels.mountpoint }} is about to fill on {{ $labels.instance }}"
          runbook_url: "https://github.com/FlavioImbertDomingos/corewatch/blob/main/docs/runbooks.md#filesystem"

      - alert: AixMksysbTooOld
        expr: aix_mksysb_age_seconds > 8 * 86400
        labels: { severity: ticket, layer: aix }
        annotations:
          summary: "Newest mksysb image on {{ $labels.instance }} is {{ $value | humanizeDuration }} old"
          runbook_url: "https://github.com/FlavioImbertDomingos/corewatch/blob/main/docs/runbooks.md#aixmksysb"

      - alert: AixCollectorStale
        expr: time() - aix_collector_last_run_seconds > 900
        labels: { severity: ticket, layer: aix }
        annotations:
          summary: "The AIX collector on {{ $labels.instance }} has not run for {{ $value | humanizeDuration }}"
          runbook_url: "https://github.com/FlavioImbertDomingos/corewatch/blob/main/docs/runbooks.md#collectorstale"

  - name: linux
    rules:
      - alert: LinuxFilesystemNearlyFull
        expr: |
          node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"}
            / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"} < 0.10
        for: 10m
        labels: { severity: ticket, layer: linux }
        annotations:
          summary: "{{ $labels.mountpoint }} has {{ $value | humanizePercentage }} free on {{ $labels.instance }}"
          runbook_url: "https://github.com/FlavioImbertDomingos/corewatch/blob/main/docs/runbooks.md#filesystem"

      - alert: LinuxFilesystemFull
        expr: |
          node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"}
            / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"} < 0.03
        for: 2m
        labels: { severity: page, layer: linux }
        annotations:
          summary: "{{ $labels.mountpoint }} is about to fill on {{ $labels.instance }}"
          runbook_url: "https://github.com/FlavioImbertDomingos/corewatch/blob/main/docs/runbooks.md#filesystem"

      - alert: LinuxFilesystemFillsWithinFourHours
        expr: |
          predict_linear(node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"}[1h], 4 * 3600) < 0
            and node_filesystem_avail_bytes / node_filesystem_size_bytes < 0.30
        for: 15m
        labels: { severity: ticket, layer: linux }
        annotations:
          summary: "{{ $labels.mountpoint }} on {{ $labels.instance }} will be full within 4 hours at the current rate"
          runbook_url: "https://github.com/FlavioImbertDomingos/corewatch/blob/main/docs/runbooks.md#filesystem"

      - alert: LinuxMultipathFailed
        expr: linux_multipath_paths{state="failed"} > 0
        for: 5m
        labels: { severity: page, layer: linux }
        annotations:
          summary: "{{ $value }} multipath paths have failed on {{ $labels.instance }}"
          runbook_url: "https://github.com/FlavioImbertDomingos/corewatch/blob/main/docs/runbooks.md#linuxmultipath"

      - alert: LinuxSwapHigh
        expr: 1 - node_memory_SwapFree_bytes / node_memory_SwapTotal_bytes > 0.70 and node_memory_SwapTotal_bytes > 0
        for: 10m
        labels: { severity: ticket, layer: linux }
        annotations:
          summary: "Swap is {{ $value | humanizePercentage }} used on {{ $labels.instance }}"
          runbook_url: "https://github.com/FlavioImbertDomingos/corewatch/blob/main/docs/runbooks.md#linuxswap"

      - alert: LinuxRebootPending
        expr: linux_reboot_required == 1
        for: 7d
        labels: { severity: ticket, layer: linux }
        annotations:
          summary: "{{ $labels.instance }} has needed a reboot for a week to finish patching"
          runbook_url: "https://github.com/FlavioImbertDomingos/corewatch/blob/main/docs/runbooks.md#linuxpatching"

      - alert: LinuxSecurityUpdatesWaiting
        expr: linux_security_updates_pending > 0
        for: 30d
        labels: { severity: ticket, layer: linux }
        annotations:
          summary: "{{ $labels.instance }} has had {{ $value }} security updates waiting for 30 days"
          runbook_url: "https://github.com/FlavioImbertDomingos/corewatch/blob/main/docs/runbooks.md#linuxpatching"

      - alert: LinuxCollectorStale
        expr: time() - linux_collector_last_run_seconds > 900
        labels: { severity: ticket, layer: linux }
        annotations:
          summary: "The Linux collector on {{ $labels.instance }} has not run for {{ $value | humanizeDuration }}"
          runbook_url: "https://github.com/FlavioImbertDomingos/corewatch/blob/main/docs/runbooks.md#collectorstale"
