[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "corewatch"
version = "0.1.0"
description = "Prometheus monitoring for Db2 on AIX and Linux: a Db2 exporter, host collectors and alert rules"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Flavio Domingos" }]
dependencies = ["ibm_db>=3.2", "prometheus-client>=0.19", "PyYAML>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
corewatch-db2 = "corewatch.exporter:main"
corewatch-textfiles = "corewatch.textfile_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
