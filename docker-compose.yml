# One-command demo: Db2 Community Edition and/or Informix Developer Edition,
# plus the full monitoring stack.
#
#   bin/corewatch-demo up            # asks which database to start
#   bin/corewatch-demo up both       # or name it: db2, informix, both
#
# The script writes COMPOSE_PROFILES and COREWATCH_ENGINES to .env, so plain
# "docker compose up -d" afterwards starts the same selection.
#
# First start: Db2 takes three to five minutes to create its database,
# Informix about one minute.
# Grafana: http://localhost:3000   Prometheus: http://localhost:9090
# Alertmanager: http://localhost:9093   Exporter: http://localhost:9953/metrics

x-corewatch-image: &corewatch-image
  build: .
  image: corewatch-local:latest
  platform: linux/amd64

services:
  db2:
    image: icr.io/db2_community/db2:latest
    profiles: [db2]
    privileged: true            # required by the IBM image
    platform: linux/amd64
    environment:
      LICENSE: accept
      DB2INST1_PASSWORD: ${DB2_PASSWORD:?set DB2_PASSWORD in .env (bin/corewatch-demo does this)}
      DBNAME: testdb
    volumes:
      - db2data:/database
    ports:
      - "127.0.0.1:50000:50000"

  informix:
    image: icr.io/informix/informix-developer-database:15.0.1.0.3
    profiles: [informix]
    hostname: ifx               # the image's sqlhosts listens on this host name
    privileged: true            # required by the IBM image
    platform: linux/amd64
    environment:
      LICENSE: accept
      SIZE: small
      # One-time setup on first start: passwords, the corewatch monitoring
      # user, a data dbspace, the corebank demo database and a level-0 archive.
      RUN_FILE_POST_INIT: post_init.sh
      INFORMIX_PASSWORD: ${INFORMIX_PASSWORD:-}
      COREWATCH_INFORMIX_PASSWORD: ${COREWATCH_INFORMIX_PASSWORD:-}
    volumes:
      - ifxdata:/opt/ibm/data
      - ./demo/informix/post_init.sh:/opt/ibm/files/post_init.sh:ro
    ports:
      - "127.0.0.1:9088:9088"   # SQLI: dbaccess, JDBC, ESQL/C applications
      - "127.0.0.1:9089:9089"   # DRDA: the corewatch exporter
    healthcheck:
      test: ["CMD", "/opt/ibm/scripts/informix_alive.sh"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 180s

  corewatch:
    <<: *corewatch-image
    environment:
      DB2_PASSWORD: ${DB2_PASSWORD:?set DB2_PASSWORD in .env}
      COREWATCH_INFORMIX_PASSWORD: ${COREWATCH_INFORMIX_PASSWORD:-}
      # Only the targets of these engines are monitored, so a stopped database
      # is not reported as down. Set by bin/corewatch-demo.
      COREWATCH_ENGINES: ${COREWATCH_ENGINES:-db2}
    volumes:
      - ./demo/config.yml:/etc/corewatch/config.yml:ro
    ports:
      - "127.0.0.1:9953:9953"
    restart: unless-stopped

  demo-workload:
    <<: *corewatch-image
    entrypoint: ["python", "/demo/workload.py"]
    command: ["traffic"]
    environment:
      DB2_PASSWORD: ${DB2_PASSWORD:?set DB2_PASSWORD in .env}
      INFORMIX_PASSWORD: ${INFORMIX_PASSWORD:-}
      COREWATCH_ENGINES: ${COREWATCH_ENGINES:-db2}
      DEMO_TRAFFIC: ${DEMO_TRAFFIC:-on}
    volumes:
      - ./demo/workload.py:/demo/workload.py:ro
    restart: unless-stopped

  demo-jobs:
    image: busybox:1.36
    command: ["/jobs.sh"]
    volumes:
      - ./demo/jobs.sh:/jobs.sh:ro
      - ./collectors/common/corewatch_job.sh:/corewatch_job.sh:ro
      - textfiles:/textfiles

  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.8.2
    command:
      - --collector.textfile.directory=/textfiles
    volumes:
      - textfiles:/textfiles:ro

  blackbox:
    image: quay.io/prometheus/blackbox-exporter:v0.25.0
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro

  prometheus:
    image: quay.io/prometheus/prometheus:v2.54.1
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
    ports:
      - "127.0.0.1:9090:9090"

  alertmanager:
    image: quay.io/prometheus/alertmanager:v0.27.0
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "127.0.0.1:9093:9093"

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  db2data:
  ifxdata:
  textfiles:
